name: Publish release

on:
  push:
    tags:
      - "6sp-ds-resukisu-susfs-OS3.0.304.0-r*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc bison build-essential curl file flex git jq openssl patch perl repo rsync unzip zip

      - name: Build release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build.sh "$RUNNER_TEMP/aosp"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            releases/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
