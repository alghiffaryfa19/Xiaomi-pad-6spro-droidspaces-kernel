name: Build kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc bison build-essential file flex git openssl perl repo rsync unzip zip
          sudo apt-get clean

      - name: Sync pinned AOSP source
        run: ./build.sh sync "$RUNNER_TEMP/aosp"

      - name: Build release
        run: ./build.sh release "$RUNNER_TEMP/aosp"

      - name: Upload release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 6sp-droidspaces-kernel
          path: releases/*
          if-no-files-found: error
